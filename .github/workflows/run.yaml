      - name: Train model and generate report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python train_model.py

          echo "# Model Training Report" > report.md

          echo "## Random Forest and Logistic Regression Scores" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "" >> report.md
          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "" >> report.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report.md

          echo "Checking generated files..."
          ls -lh scores.txt ConfusionMatrix.png FeatureImportance.png

          echo "Publishing CML report..."
          cml comment create --publish report.md
