name: Model Training CICD

on:
  push:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Train model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python train_model.py

      - name: Verify model outputs
        run: |
          test -f scores.txt
          test -f ConfusionMatrix.png
          test -f FeatureImportance.png

      - name: Generate report
        run: |
          {
            echo "# Model Training Report"
            echo ""
            echo "## Random Forest and Logistic Regression Scores"
            echo ""
            cat scores.txt
            echo ""
            echo "## Generated Artifacts"
            echo ""
            echo "- ConfusionMatrix.png"
            echo "- FeatureImportance.png"
          } > report.md

      - name: Publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create --publish=false report.md
