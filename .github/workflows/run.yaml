name: Model Training CICD

on:
  push:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # Set up CML
      - name: Set up CML
        uses: iterative/setup-cml@v2

      # Train model
      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python train_model.py

      # Verify generated files
      - name: Verify model outputs
        run: |
          test -f scores.txt
          test -f ConfusionMatrix.png
          test -f FeatureImportance.png

          echo "All model output files exist."

      # Generate report
      - name: Generate report
        run: |
          {
            echo "# Model Training Report"
            echo ""
            echo "## Random Forest and Logistic Regression Scores"
            echo ""
            cat scores.txt
            echo ""
            echo "## Confusion Matrix"
            echo ""
            echo "![Confusion Matrix](./ConfusionMatrix.png)"
            echo ""
            echo "## Feature Importance"
            echo ""
            echo "![Feature Importance](./FeatureImportance.png)"
          } > report.md

          cat report.md

      # Publish report
      - name: Publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create --publish report.md
